name: image
on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:
permissions:
  contents: read
  packages: write
concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Unit tests (no Docker, no queue checkout needed)
        run: python3 -W ignore -m unittest discover -s tests
  publish:
    needs: test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: ghcr.io/frindle/dispatch-cpu-runner
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short
            type=semver,pattern={{version}}
          labels: |
            org.opencontainers.image.source=https://github.com/frindle/dispatch-cpu-runner
            org.opencontainers.image.licenses=MIT
      - id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke the pushed image (job python + node + agent caps)
        run: |
          img=ghcr.io/frindle/dispatch-cpu-runner@${{ steps.build.outputs.digest }}
          docker run --rm --entrypoint python3 "$img" -c "import sys,sqlite3,ssl,flask,requests,paramiko; assert sys.version_info[:2]==(3,14), sys.version; print('job python', sys.version.split()[0])"
          docker run --rm --entrypoint node "$img" -v
          docker run --rm --entrypoint /usr/bin/python3 "$img" -c "import runpy,json; m=runpy.run_path('/opt/runner/agent.py'); c=m['detect_caps'](); print(json.dumps(c)); assert c['python']=='3.14' and c['node']==26 and c['sqlite3'] and 'flask' in c['py_modules'], c"
