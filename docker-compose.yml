# Deploy dir on Unraid: /mnt/user/data/dispatch-cpu-runner/   (build context = this dir)
# Never edit by hand: on the Mac run scripts/provision.sh (secrets/token + .env are generated), then
# on Unraid run ./deploy.sh. Updates: Mac `update.sh` (agent code is mounted, it self-reloads).
services:
  cpu-runner:
    build: .
    image: dispatch-cpu-runner:latest
    container_name: dispatch-cpu-runner
    restart: unless-stopped
    env_file: .env
    environment:
      CPU_RUNNER_TOKEN_FILE: /run/secrets/cpu_runner_token
      CPU_RUNNER_ID: unraid-cpu-1
    secrets: [cpu_runner_token]
    volumes:
      - ./agent:/opt/runner:ro    # agent code mounted (not baked): update = rsync, agent re-execs itself
      - ./cache:/cache            # persistent npm + node_modules caches (data share)
      - cpu-runner-work:/work     # scratch checkouts; named volume (docker img storage), wiped at startup
    # ---- explicit resource limits (shared by all CPU_RUNNER_CONCURRENCY jobs) ----
    cpus: ${CPU_RUNNER_CPUS:-8}
    mem_limit: ${CPU_RUNNER_MEM:-16g}
    memswap_limit: ${CPU_RUNNER_MEM:-16g}
    pids_limit: 4096
    # ---- privileges: only what the empty-netns + privilege-drop wrapper needs ----
    cap_drop: [ALL]
    cap_add: [SYS_ADMIN, NET_ADMIN, SETUID, SETGID, SETPCAP, CHOWN, DAC_OVERRIDE, FOWNER, KILL]
    # If the startup selftest cannot create a network namespace run `./deploy.sh --relax-seccomp`
    # (writes docker-compose.override.yml; this file stays untouched).
    stop_grace_period: 45s
    init: true
    logging:
      driver: json-file
      options: {max-size: "20m", max-file: "3"}
secrets:
  cpu_runner_token:
    file: ./secrets/token
volumes:
  cpu-runner-work:
